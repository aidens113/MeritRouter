# Preset: standalone-free. MeritRouter's own supervisor runs on the most capable eligible free model; workers are free.
# Generated from meritrouter.config.example.yaml by scripts/build-presets.mjs.


# MeritRouter configuration. Relative paths resolve against this file's directory.
# Every setting here can also be edited from the web panel (Settings).
version: 1

# Model providers. MeritRouter calls each provider directly with your keys and finds the models
# they can use. Add keys in the panel (Provider keys) or with
#   MERITROUTER_NEW_KEY=<key> meritrouter keys add groq --billing free_tier
# (both store them encrypted), or declare them here. Built-in providers: groq, google, nvidia,
# openrouter, mistral, cerebras, cohere, cloudflare, sambanova, together, huggingface, anthropic,
# openai, deepseek, fireworks, deepinfra, nebius, scaleway, ovhcloud, zai, moonshot, vercel,
# ollama-cloud, and the local servers ollama, lmstudio, llamacpp. billing_class is required:
# free_tier keys never cost money; paid_credits, paid_postpaid, and trial keys are paid and follow
# the paid section below. Prefer api_key_env; a literal api_key puts the secret in this file
# (meritrouter doctor warns about it).
providers:
  request_timeout_seconds: 300
  # groq:
  #   keys:
  #     - { api_key_env: GROQ_API_KEY, billing_class: free_tier }
  # openrouter:
  #   keys:
  #     - { api_key_env: OPENROUTER_API_KEY, billing_class: free_tier }
  # google:                       # Gemini quotas are per project: keys of one project share a quota_group
  #   keys:
  #     - { api_key_env: GEMINI_API_KEY, billing_class: free_tier, quota_group: my-project, rpm: 10 }
  # cloudflare:
  #   account_id: <your account id>
  #   keys:
  #     - { api_key_env: CLOUDFLARE_API_TOKEN, billing_class: free_tier }
  # deepseek:                     # limits concurrent requests: set team.provider_concurrency_limits.deepseek
  #   keys:
  #     - { api_key_env: DEEPSEEK_API_KEY, billing_class: paid_credits }
  #
  # Local servers are built in and take no key; an entry turns one on:
  # ollama: {}                    # 127.0.0.1:11434, or OLLAMA_HOST when set; base_url for another host
  #   # default_context_tokens: 32768   # the server's default context (OLLAMA_CONTEXT_LENGTH or by VRAM; 4096 assumed)
  # lmstudio: {}                  # localhost:1234; add its token as a key only if API tokens are on
  # llamacpp:
  #   base_url: http://127.0.0.1:8080/v1   # required: llama-server's default port differs by release
  # ovhcloud: { rpm: 2 }          # anonymous (no key): 2 requests per minute per model and IP
  #
  # Any other OpenAI-compatible server or provider is a custom entry with base_url (see
  # docs/setup.md, "Custom providers"). Servers without auth set no_key: true.
  # vllm:      { base_url: http://localhost:8000/v1, no_key: true }
  # localai:   { base_url: http://localhost:8080/v1, no_key: true }
  # jan:       { base_url: http://127.0.0.1:1337/v1, no_key: true }
  # koboldcpp: { base_url: http://localhost:5001/v1, no_key: true }
  # textgen:   { base_url: http://127.0.0.1:5000/v1, no_key: true }     # text-generation-webui --api
  # sglang:    { base_url: http://127.0.0.1:30000/v1, no_key: true }
  # xai:
  #   base_url: https://api.x.ai/v1
  #   token_limit_param: max_completion_tokens
  #   keys: [{ api_key_env: XAI_API_KEY, billing_class: paid_credits }]
  # venice:                       # its reset header is an epoch-ms timestamp; the openai family reads it
  #   base_url: https://api.venice.ai/api/v1
  #   rate_limit_headers: openai
  #   keys: [{ api_key_env: VENICE_API_KEY, billing_class: paid_credits }]
  # More (Alibaba, MiniMax, Novita, Hyperbolic, Chutes, Featherless, Baseten, AI21, SiliconFlow,
  # Azure, Bedrock) with their base URLs and caveats: docs/setup.md, "Custom providers".

storage:
  directory: .meritrouter

# Shared knowledge: a git repository of markdown working documents (FluxIQ protocol).
brain:
  path: ~/.meritrouter/brain # shared across projects; created and git-initialised on first use
  project: my-project
  mounts: [] # e.g. [{ prefix: projects/my-project/working, path: ../my-app/docs/working }]
  commit: true # every write is a commit under the writing agent's identity
  push: false
  worker_reports: true # each worker's report lands in its working document's reports/ folder
  access_approver: supervisor # who decides workers' requests for more access: supervisor | human | auto
  auto_approve: [] # e.g. [{ pattern: "projects/my-project/decisions/**", mode: read, min_tier: T2 }]

# The initiating client remains FINAL supervisor; internal supervisors own bounded delivery.
client_supervision:
  workflow: delegated_delivery # direct_tasks retains the legacy client-coordinated workflow
  dispatch_final_supervisor: false

# Internal supervisors require current quality evidence; paid policy remains independent.
supervisor:
  endpoints: []
  paid_policy: never
  max_concurrent_jobs: 1

# Agent teams: how one job's task graph (plan_work) runs. execution.max_concurrent_tasks still
# bounds everything; team.max_agents replaces supervisor.max_workers_per_job (still read as an alias).
team:
  max_agents: 8 # most tasks of one job running at once
  # A job's budget is one request pool: each delegated task holds its budget (the brief's
  # max_requests, else default_task_requests, else its tier's cap) while open; unused requests return.
  # Delegated delivery defaults to the 600-request ceiling above. Explicit smaller profile
  # or task ceilings still apply. Legacy direct_tasks keeps its previous uncapped default.
  # default_task_requests: 40
  supervisor_reserve_requests: 4 # never granted to tasks: kept for the supervisor's own turns
  # Workers running low ask for more (request_more_budget) and wait for a decision.
  budget_approver: supervisor # supervisor (top-level tasks: the MCP client) | auto | human
  budget_request_wait_seconds: 300
  max_budget_requests_per_task: 3
  auto_grant_max: 30 # most the auto approver grants per request

# Per-role rules: override a charter or add rules. Roles: supervisor, summarizer, inspector,
# analyst, implementer, reviewer, classifier.
roles: {}
#  implementer:
#    extra_rules: ["Use the repository's logger, never console.log"]

models:
  file: models.yaml # manual models and per-model overrides (optional)
  max_metadata_age_days: 30

discovery:
  interval_minutes: 60 # rediscover models with your keys this often (0 disables)
  probe_tools: false # opt-in: one cheap request to learn tool support when unreported
  max_probe_requests_per_day: 20
  require_confirmation_for_heuristic_params: true

tiers:
  T1:
    {
      max_score: 3,
      min_total_parameters_b: 30,
      max_model_requests: 20,
      prefer: smallest_sufficient
    }
  T2:
    {
      max_score: 7,
      min_total_parameters_b: 100,
      max_model_requests: 60,
      prefer: smallest_sufficient
    }
  T3:
    {
      max_score: 11,
      min_total_parameters_b: 100,
      max_model_requests: 100,
      prefer: most_capable
    }

routing:
  max_endpoint_fallbacks: 3
  escalate_on_failure: true
  respect_provider_cooldowns: true
  sticky_endpoints: true # keep a conversation on the model that served its last turn (prompt cache reuse)

scoring:
  # rulebook_file: rulebook.yaml   # omit to use the built-in rulebook
  cache: true
  batch_window_ms: 400
  max_batch: 8

qualification:
  required: false # turn on once models have been qualified
  trials_per_task: 3
  pass_threshold: 0.6
  min_trials: 6
  max_requests_per_day: 200

# Projects: one install holds many. Each has its own repositories, brain folder
# (brain/projects/<slug>/), jobs, tasks, and sessions; everything else in this file is global.
# A project may also override brain (mounts, access_approver, auto_approve), verification, team
# (max_agents, max_depth, ...), coding (allowed_commands, protected_paths), supervisor
# (allowed_commands, branch_prefix), and roles. Add one with
# `meritrouter projects create <slug> --repo <alias>=<path>`, or in the panel.
projects:
  my-project:
    name: My project
    repositories:
      app:
        path: ../my-app # replace with a real path
    # Optional, per project (unset = no per-project limit; global limits always apply):
    # priority: 1                 # share of worker turns relative to other projects
    # max_concurrent_tasks: 2     # running tasks of this project at once
    # request_share: 0.5          # fraction of the allocation below this project may use
    # paid_budgets: { per_day_usd: 1, per_week_usd: 5, per_month_usd: 15 }
    # Add more projects here, in the panel (New project), or with `meritrouter projects create`.

execution:
  max_concurrent_tasks: 4
  max_concurrent_writers_per_repository: 4
  max_model_requests_per_task: 150 # a runaway guard per attempt; workers can ask their supervisor for more
  job_timeout_seconds: 1200
  on_capacity_exhausted: queue
  await_max_seconds: 240

allocation:
  max_model_requests_per_hour: 1000
  max_model_requests_per_day: 10000

# Verification and the optional per-task total: every request of a task (execution, review, repair)
# counts against max_total_requests_per_task when configured. Unset/null means no task-wide ceiling.
verification:
  max_total_requests_per_task: null
  budget:
    review_requests: { deep: 12, strict: 16 } # an independent reviewer reads the change before judging it

# Paid routing policy and budgets. A model is free only when verified: priced at $0, a :free id,
# or served by a free_tier key (then only free_tier keys serve it). Everything else is paid and
# follows this section, including the priced models a paid key under providers can reach.
# paid.providers and paid.models declare paid models by hand, with prices.
paid:
  enabled: false
  budgets:
    per_week_usd: 0
  tiers:
    T1: never
    T2: never
    T3: never
    T4: never
  max_paid_attempts: 2
  providers: {}
  models: []
coding:
  runner: native # native (MeritRouter harness) | opencode | command
  command: opencode # executable for runner: opencode, or the full command for runner: command
  allowed_commands: [] # e.g. ["npm test*", "pnpm test*"]
  allow_repo_agent_config: false
  max_check_runs_per_task: 20 # runs of a task's declared checks (run_check) a native coding worker may make

panel:
  port: 4477
  auto_start: true # the MCP server and workers start the panel when nothing answers on the port
  token_env: MERITROUTER_PANEL_TOKEN

profiles:
  supervise:
    mode: supervisor
    tools: supervisor
    min_total_parameters_b: 100
    max_model_requests: null
    max_output_tokens: 8000
    classify: never
    min_tier: T3
  summarize:
    mode: completion
    min_total_parameters_b: 30
    max_model_requests: 4
    max_output_tokens: 6000
    classify: never
    batching: { enabled: true, max_items: 8, per_item_output_tokens: 800 }
  inspect:
    mode: read_only
    min_total_parameters_b: 30
    max_model_requests: 40
    tools: repository_read
  analyze:
    mode: read_only
    min_total_parameters_b: 100
    max_model_requests: 60
    tools: repository_read_and_artifacts
    min_tier: T2
  implement:
    mode: coding
    min_total_parameters_b: 100
    max_model_requests: 100
    workspace: isolated_worktree
    tools: scoped_edit_and_checks
    min_tier: T2
  review:
    mode: read_only
    min_total_parameters_b: 100
    max_model_requests: 40
    tools: repository_read_and_artifacts
    min_tier: T2
