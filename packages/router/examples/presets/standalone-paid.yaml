# Preset: standalone-paid. Paid supervisor; paid models preferred for T2-T3 and used for T4 work; free models for T1.
# Generated from switchyard.config.example.yaml by scripts/build-presets.mjs.


# SwitchYard Router configuration. Relative paths resolve against this file's directory.
# Every setting here can also be edited from the web panel (Settings).
version: 1

gateway:
  adapter: freellmapi
  base_url: http://localhost:3001/v1
  api_key_env: FREELLMAPI_API_KEY # unified FreeLLMAPI key (inference)
  admin_token_env: FREELLMAPI_ADMIN_TOKEN # dashboard session token (catalog, chains, keys)
  require_verified_chains: true # refuse dispatch unless the model's chain is verified
  bypass_cache: true # FreeLLMAPI's cache is shared across clients

storage:
  directory: .switchyard

# Shared knowledge: a git repository of markdown working documents (FluxIQ protocol).
brain:
  path: ~/.switchyard/brain # shared across projects; created and git-initialised on first use
  project: my-project
  mounts: [] # e.g. [{ prefix: projects/my-project/working, path: ../my-app/docs/working }]
  commit: true # every write is a commit under the writing agent's identity
  push: false
  worker_reports: true # each worker's report lands in its working document's reports/ folder
  access_approver: supervisor # who decides workers' requests for more access: supervisor | human | auto
  auto_approve: [] # e.g. [{ pattern: "projects/my-project/decisions/**", mode: read, min_tier: T2 }]

# Standalone jobs (used when profiles.supervise exists; see the standalone presets).
supervisor:
  endpoints:
    - paid:anthropic/REPLACE-with-a-model-id
  paid_policy: preferred
  max_concurrent_jobs: 1

# Agent teams: how one job's task graph (plan_work) runs. execution.max_concurrent_tasks still
# bounds everything; team.max_agents replaces supervisor.max_workers_per_job (still read as an alias).
team:
  max_agents: 8 # most tasks of one job running at once

# Per-role rules: override a charter or add rules. Roles: supervisor, summarizer, inspector,
# analyst, implementer, reviewer, classifier.
roles: {}
#  implementer:
#    extra_rules: ["Use the repository's logger, never console.log"]

models:
  file: models.yaml # manual models and per-model overrides (optional)
  max_metadata_age_days: 30

discovery:
  interval_minutes: 60
  # Platforms where every model is a free tier on YOUR accounts. Never inferred.
  # OpenRouter models count as free only when their published price is 0.
  free_platforms: [] # e.g. [groq, google, nvidia, kilo]
  require_confirmation_for_heuristic_params: true

tiers:
  T1:
    {
      max_score: 3,
      min_total_parameters_b: 30,
      max_model_requests: 4,
      prefer: smallest_sufficient
    }
  T2:
    {
      max_score: 7,
      min_total_parameters_b: 100,
      max_model_requests: 8,
      prefer: smallest_sufficient
    }
  T3:
    {
      max_score: 11,
      min_total_parameters_b: 100,
      max_model_requests: 12,
      prefer: most_capable
    }

routing:
  max_endpoint_fallbacks: 3
  escalate_on_failure: true
  respect_provider_cooldowns: true

scoring:
  # rulebook_file: rulebook.yaml   # omit to use the built-in rulebook
  cache: true
  batch_window_ms: 400
  max_batch: 8

qualification:
  required: false # turn on once models have been qualified
  trials_per_task: 3
  pass_threshold: 0.6
  min_trials: 6
  max_requests_per_day: 200

repositories:
  app:
    path: ../my-app # replace with a real path

execution:
  max_concurrent_tasks: 2
  max_concurrent_writers_per_repository: 1
  max_model_requests_per_task: 16
  job_timeout_seconds: 1200
  on_capacity_exhausted: queue
  await_max_seconds: 240

allocation:
  max_model_requests_per_hour: 150
  max_model_requests_per_day: 1500

# Direct paid routes (never through FreeLLMAPI). Keys: `switchyard keys add <provider>`.
paid:
  enabled: true
  budgets:
    per_week_usd: 20
    per_month_usd: 60
  tiers:
    T1: never
    T2: preferred
    T3: preferred
    T4: premium
  max_paid_attempts: 2
  providers:
    anthropic:
      kind: anthropic
      base_url: https://api.anthropic.com
  models:
    - provider: anthropic
      model: REPLACE-with-a-model-id
      display_name: Claude (set the model id and current prices before use)
      context_limit_tokens: 200000
      output_limit_tokens: 16000
      input_modalities:
        - text
        - image
      supports_tools: true
      ignore_size_floor: true
coding:
  runner: native # native (SwitchYard harness) | opencode | command
  command: opencode # executable for runner: opencode, or the full command for runner: command
  allowed_commands: [] # e.g. ["npm test*", "pnpm test*"]
  allow_repo_agent_config: false

panel:
  port: 4477
  token_env: SWITCHYARD_PANEL_TOKEN

profiles:
  summarize:
    mode: completion
    min_total_parameters_b: 30
    max_model_requests: 4
    max_output_tokens: 6000
    classify: never
    batching: { enabled: true, max_items: 8, per_item_output_tokens: 800 }
  inspect:
    mode: read_only
    min_total_parameters_b: 30
    max_model_requests: 6
    tools: repository_read
  analyze:
    mode: read_only
    min_total_parameters_b: 100
    max_model_requests: 10
    tools: repository_read_and_artifacts
    min_tier: T2
  implement:
    mode: coding
    min_total_parameters_b: 100
    max_model_requests: 12
    workspace: isolated_worktree
    tools: scoped_edit_and_checks
    min_tier: T2
  review:
    mode: read_only
    min_total_parameters_b: 100
    max_model_requests: 8
    tools: repository_read_and_artifacts
    min_tier: T2
  supervise:
    mode: supervisor
    tools: supervisor
    min_total_parameters_b: 100
    max_model_requests: 60
    max_output_tokens: 8000
    classify: never
    min_tier: T3
