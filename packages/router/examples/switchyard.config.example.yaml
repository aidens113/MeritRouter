# SwitchYard Router configuration. Relative paths resolve against this file's directory.
# Every setting here can also be edited from the web panel (Settings).
version: 1

# Model providers. SwitchYard calls each provider directly with your keys and finds the models
# they can use. Add keys in the panel (Provider keys) or with
#   SWITCHYARD_NEW_KEY=<key> switchyard keys add groq --billing free_tier
# (both store them encrypted), or declare them here. Built-in providers: groq, google, nvidia,
# openrouter, mistral, cerebras, cohere, cloudflare, sambanova, together, huggingface, anthropic,
# openai. billing_class is required: free_tier keys never cost money; paid_credits,
# paid_postpaid, and trial keys are paid and follow the paid section below. Prefer api_key_env;
# a literal api_key puts the secret in this file (switchyard doctor warns about it).
providers:
  request_timeout_seconds: 300
  # groq:
  #   keys:
  #     - { api_key_env: GROQ_API_KEY, billing_class: free_tier }
  # openrouter:
  #   keys:
  #     - { api_key_env: OPENROUTER_API_KEY, billing_class: free_tier }
  # google:                       # Gemini quotas are per project: keys of one project share a quota_group
  #   keys:
  #     - { api_key_env: GEMINI_API_KEY, billing_class: free_tier, quota_group: my-project, rpm: 10 }
  # cloudflare:
  #   account_id: <your account id>
  #   keys:
  #     - { api_key_env: CLOUDFLARE_API_TOKEN, billing_class: free_tier }
  # local:                        # any OpenAI-compatible server (Ollama, llama.cpp, vLLM, LM Studio)
  #   base_url: http://localhost:11434/v1
  #   no_key: true

storage:
  directory: .switchyard

# Shared knowledge: a git repository of markdown working documents (FluxIQ protocol).
brain:
  path: ~/.switchyard/brain     # shared across projects; created and git-initialised on first use
  project: my-project           # the primary project (system tasks); each project's brain is brain/projects/<slug>/
  mounts: []                    # e.g. [{ prefix: projects/my-project/working, path: ../my-app/docs/working }]
  commit: true                  # every write is a commit under the writing agent's identity
  push: false
  worker_reports: true          # each worker's report lands in its working document's reports/ folder
  access_approver: supervisor   # who decides workers' requests for more access: supervisor | human | auto
  auto_approve: []              # e.g. [{ pattern: "projects/my-project/decisions/**", mode: read, min_tier: T2 }]

# Standalone jobs (used when profiles.supervise exists; see the standalone presets).
supervisor:
  endpoints: []                 # models for the supervisor, in order; empty = most capable eligible T3 model
  paid_policy: never            # never | on_free_exhaustion | preferred
  max_concurrent_jobs: 1
  job_timeout_seconds: 14400
  branch_prefix: switchyard/job-
  allowed_commands: []          # commands the supervisor may run besides its briefs' checks

# Agent teams: how one job's task graph (plan_work) runs. execution.max_concurrent_tasks still
# bounds everything; team.max_agents replaces supervisor.max_workers_per_job (still read as an alias).
team:
  max_agents: 8                 # most tasks of one job running at once

# Per-role rules: override a charter or add rules. Roles: supervisor, summarizer, inspector,
# analyst, implementer, reviewer, classifier.
roles: {}
#  implementer:
#    extra_rules: ["Use the repository's logger, never console.log"]

models:
  file: models.yaml            # manual models and per-model overrides (optional)
  max_metadata_age_days: 30

discovery:
  interval_minutes: 60          # rediscover models with your keys this often (0 disables)
  probe_tools: false            # opt-in: one cheap request to learn tool support when unreported
  max_probe_requests_per_day: 20
  require_confirmation_for_heuristic_params: true

tiers:
  T1: { max_score: 3,  min_total_parameters_b: 30,  max_model_requests: 4,  prefer: smallest_sufficient }
  T2: { max_score: 7,  min_total_parameters_b: 100, max_model_requests: 8,  prefer: smallest_sufficient }
  T3: { max_score: 11, min_total_parameters_b: 100, max_model_requests: 12, prefer: most_capable }

routing:
  max_endpoint_fallbacks: 3
  escalate_on_failure: true
  respect_provider_cooldowns: true

scoring:
  # rulebook_file: rulebook.yaml   # omit to use the built-in rulebook
  cache: true
  batch_window_ms: 400
  max_batch: 8

qualification:
  required: false              # turn on once models have been qualified
  trials_per_task: 3
  pass_threshold: 0.6
  min_trials: 6
  max_requests_per_day: 200

# Projects: one install holds many. Each has its own repositories, brain folder
# (brain/projects/<slug>/), jobs, tasks, and sessions; everything else in this file is global.
# A project may also override brain (mounts, access_approver, auto_approve), verification, team
# (max_agents, max_depth, ...), coding (allowed_commands, protected_paths), supervisor
# (allowed_commands, branch_prefix), and roles. Add one with
# `switchyard projects create <slug> --repo <alias>=<path>`, or in the panel.
projects:
  my-project:
    name: My project
    repositories:
      app:
        path: ../my-app        # replace with a real path

execution:
  max_concurrent_tasks: 2
  max_concurrent_writers_per_repository: 1
  max_model_requests_per_task: 16
  job_timeout_seconds: 1200
  on_capacity_exhausted: queue
  await_max_seconds: 240

allocation:
  max_model_requests_per_hour: 150
  max_model_requests_per_day: 1500

# Paid routing policy and budgets. A model is free only when verified: priced at $0, a :free id,
# or served by a free_tier key (then only free_tier keys serve it). Everything else is paid and
# follows this section, including the priced models a paid key under providers can reach.
# paid.providers and paid.models declare paid models by hand, with prices.
paid:
  enabled: false
  budgets: { per_week_usd: 0 }          # required > 0 to enable
  # never | on_free_exhaustion | preferred ; T4 accepts never | premium (paid instead of returning to the supervisor)
  tiers: { T1: never, T2: never, T3: never, T4: never }
  max_paid_attempts: 2
  providers: {}
  #  anthropic:   { kind: anthropic, base_url: https://api.anthropic.com }
  #  deepseek:    { kind: openai_compatible, base_url: https://api.deepseek.com/v1 }
  #  gemini:      { kind: openai_compatible, base_url: https://generativelanguage.googleapis.com/v1beta/openai }
  #  openrouter:  { kind: openai_compatible, base_url: https://openrouter.ai/api/v1, pricing_url: https://openrouter.ai/api/v1/models }
  models: []
  #  - provider: anthropic
  #    model: <model id>
  #    input_usd_per_million: <check the provider's current price>
  #    output_usd_per_million: <check the provider's current price>
  #    context_limit_tokens: 200000
  #    output_limit_tokens: 32000
  #    input_modalities: [text, image]
  #    ignore_size_floor: true          # closed models publish no parameter count

coding:
  runner: native               # native (SwitchYard harness) | opencode | command
  command: opencode            # executable for runner: opencode, or the full command for runner: command
  allowed_commands: []         # e.g. ["npm test*", "pnpm test*"]
  allow_repo_agent_config: false

panel:
  port: 4477
  token_env: SWITCHYARD_PANEL_TOKEN

profiles:
  summarize:
    mode: completion
    min_total_parameters_b: 30
    max_model_requests: 4
    max_output_tokens: 6000
    classify: never
    batching: { enabled: true, max_items: 8, per_item_output_tokens: 800 }
  inspect:
    mode: read_only
    min_total_parameters_b: 30
    max_model_requests: 6
    tools: repository_read
  analyze:
    mode: read_only
    min_total_parameters_b: 100
    max_model_requests: 10
    tools: repository_read_and_artifacts
    min_tier: T2
  implement:
    mode: coding
    min_total_parameters_b: 100
    max_model_requests: 12
    workspace: isolated_worktree
    tools: scoped_edit_and_checks
    min_tier: T2
  review:
    mode: read_only
    min_total_parameters_b: 100
    max_model_requests: 8
    tools: repository_read_and_artifacts
    min_tier: T2
